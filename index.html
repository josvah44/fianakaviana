<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace privé</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:#0b1020;color:#eef2ff;min-height:100vh;display:grid;place-items:center;padding:22px;line-height:1.55}
.halo{position:fixed;inset:0;z-index:-1;overflow:hidden}
.halo i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
.halo i:nth-child(1){width:46vw;height:46vw;background:#7c5cff;top:-12vw;left:-8vw}
.halo i:nth-child(2){width:38vw;height:38vw;background:#c65bff;top:24vw;right:-10vw}
.box{width:min(430px,100%);padding:36px 32px;text-align:center;border-radius:22px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);box-shadow:0 18px 45px rgba(0,0,0,.45)}
.seal{width:66px;height:66px;margin:0 auto 20px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#7c5cff,#c65bff);font-size:1.7rem;box-shadow:0 12px 30px rgba(124,92,255,.5)}
h1{font-size:1.3rem;font-weight:800;margin-bottom:8px}
p{color:#9aa6c8;font-size:.9rem}
</style>
</head>
<body>
<div class="halo"><i></i><i></i></div>
<div class="box">
  <div class="seal">🔐</div>
  <h1>Espace privé</h1>
  <p>Cet espace est en cours de préparation.<br>Il sera accessible très prochainement.</p>
</div>
</body>
</html>
